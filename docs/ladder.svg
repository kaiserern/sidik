<svg xmlns="http://www.w3.org/2000/svg" width="900" height="210" viewBox="0 0 900 210" role="img" aria-label="Tujuh tingkat bukti, dari ID transaksi sampai bot bertanya balik">
<style>
  text { font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace; }
  .lbl { font-size: 10px; letter-spacing: 2px; fill: #7C858F; }
  .num { font-size: 10px; fill: #7C858F; }
  .t { font-size: 11px; fill: #E8EBEF; }
  .c { font-size: 9.5px; }
  .step { animation: 14s infinite both; }
  @media (prefers-reduced-motion: reduce) { .step { animation: none; opacity: 0.85; } }
</style>
<rect width="900" height="210" rx="16" fill="#0B0D10"/>
<rect x="0.5" y="0.5" width="899" height="209" rx="16" fill="none" stroke="#1F262F"/>
<text class="lbl" x="24" y="34">BUKTI PALING KUAT</text>
<text class="lbl" x="876" y="34" text-anchor="end">PALING TIPIS</text>
<line x1="24" y1="46" x2="876" y2="46" stroke="#1F262F"/>
<g class="step" style="animation-name: s0">
<rect x="24" y="60" width="114" height="104" rx="10" fill="#12161C" stroke="#1F262F"/>
<text class="num" x="36" y="82">01</text>
<text class="t" x="36" y="106">ID transaksi</text>
<text class="t" x="36" y="122">dari pelapor</text>
<text class="c" x="36" y="148" fill="#bdfe0a">high</text>
</g>
<style>@keyframes s0 {0%,28%{opacity:.45} 36%,44%{opacity:1} 52%,100%{opacity:.45}}</style>
<g class="step" style="animation-name: s1">
<rect x="148" y="60" width="114" height="104" rx="10" fill="#12161C" stroke="#1F262F"/>
<text class="num" x="160" y="82">02</text>
<text class="t" x="160" y="106">Nominal, jam,</text>
<text class="t" x="160" y="122">atau struk</text>
<text class="c" x="160" y="148" fill="#E8C468">medium</text>
</g>
<style>@keyframes s1 {0%,34%{opacity:.45} 42%,50%{opacity:1} 58%,100%{opacity:.45}}</style>
<g class="step" style="animation-name: s2">
<rect x="272" y="60" width="114" height="104" rx="10" fill="#12161C" stroke="#1F262F"/>
<text class="num" x="284" y="82">03</text>
<text class="t" x="284" y="106">Satu run_id</text>
<text class="t" x="284" y="122">di semua error</text>
<text class="c" x="284" y="148" fill="#bdfe0a">high</text>
</g>
<style>@keyframes s2 {0%,40%{opacity:.45} 48%,56%{opacity:1} 64%,100%{opacity:.45}}</style>
<g class="step" style="animation-name: s3">
<rect x="396" y="60" width="114" height="104" rx="10" fill="#12161C" stroke="#1F262F"/>
<text class="num" x="408" y="82">04</text>
<text class="t" x="408" y="106">Arus per</text>
<text class="t" x="408" y="122">tahap alur</text>
<text class="c" x="408" y="148" fill="#E8C468">medium</text>
</g>
<style>@keyframes s3 {0%,46%{opacity:.45} 54%,62%{opacity:1} 70%,100%{opacity:.45}}</style>
<g class="step" style="animation-name: s4">
<rect x="520" y="60" width="114" height="104" rx="10" fill="#12161C" stroke="#1F262F"/>
<text class="num" x="532" y="82">05</text>
<text class="t" x="532" y="106">Pelapor pilih</text>
<text class="t" x="532" y="122">gejalanya</text>
<text class="c" x="532" y="148" fill="#7C858F">low</text>
</g>
<style>@keyframes s4 {0%,52%{opacity:.45} 60%,68%{opacity:1} 76%,100%{opacity:.45}}</style>
<g class="step" style="animation-name: s5">
<rect x="644" y="60" width="114" height="104" rx="10" fill="#12161C" stroke="#1F262F"/>
<text class="num" x="656" y="82">06</text>
<text class="t" x="656" y="106">Bandingkan</text>
<text class="t" x="656" y="122">7 hari</text>
<text class="c" x="656" y="148" fill="#7C858F">low</text>
</g>
<style>@keyframes s5 {0%,58%{opacity:.45} 66%,74%{opacity:1} 82%,100%{opacity:.45}}</style>
<g class="step" style="animation-name: s6">
<rect x="768" y="60" width="108" height="104" rx="10" fill="#12161C" stroke="#1F262F"/>
<text class="num" x="780" y="82">07</text>
<text class="t" x="780" y="106">Bot tanya</text>
<text class="t" x="780" y="122">balik</text>
<text class="c" x="780" y="148" fill="#7C858F">-</text>
</g>
<style>@keyframes s6 {0%,64%{opacity:.45} 72%,80%{opacity:1} 88%,100%{opacity:.45}}</style>
<text class="c" x="24" y="186" fill="#7C858F">Tingkat yang dipakai selalu disebut di baris &quot;Dasar&quot;, jadi pembaca tahu sekuat apa buktinya.</text>
</svg>
